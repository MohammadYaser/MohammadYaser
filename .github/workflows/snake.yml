name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: Platane/snk@v3
        with:
          github_user_name: MohammadYaser
          outputs: |
            output/snake.svg
      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update snake animation"
          add: "output/snake.svg"
